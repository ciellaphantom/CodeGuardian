<!DOCTYPE html>
<html>
<head>
    <title>CodeGuardian Demo</title>
    <style>
        body { font-family: Arial; width: 800px; margin: 40px auto; }
        textarea { width: 100%; height: 200px; }
        button { margin-top: 10px; padding: 10px 20px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; font-size: 0.9rem; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<h1>CodeGuardian — Vulnerability Scanner Demo</h1>

<p>Paste your Python code and click “Scan”.</p>

<textarea id="inputCode" placeholder="Paste your code here..."></textarea>
<br>
<button onclick="scan()">Scan</button>

<h3 id="status"></h3>

<table id="results" style="display:none;">
    <thead>
        <tr>
            <th>Severity</th>
            <th>Policy</th>
            <th>Line</th>
            <th>Message</th>
            <th>Suggested Fix</th>
        </tr>
    </thead>
    <tbody id="resultsBody"></tbody>
</table>

<script>
async function scan() {
    const code = document.getElementById("inputCode").value;

    const response = await fetch("http://127.0.0.1:8000/scan", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: code })
    });

    const data = await response.json();
    document.getElementById("status").innerText = data.message;

    const table = document.getElementById("results");
    const body = document.getElementById("resultsBody");
    body.innerHTML = "";

    if (data.findings.length > 0) {
        table.style.display = "table";
        data.findings.forEach(f => {
            let row = `
                <tr>
                    <td>${f.severity}</td>
                    <td>${f.policy}</td>
                    <td>${f.line}</td>
                    <td>${f.message}</td>
                    <td>${f.suggested_fix}</td>
                </tr>
            `;
            body.innerHTML += row;
        });
    } else {
        table.style.display = "none";
    }
}
</script>

</body>
</html>
